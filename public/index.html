<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e9e9e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="app-icon.svg">

</head>
<body>
<title>Human Takeaway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: one rounded app sheet; a large stage panel on the left (upload, then the drafts), a narrow column of instrument cards on the right. Monochrome only. */
:root {
  --page: #e9e9e7;
  --sheet: #ffffff;
  --panel: #f4f4f2;
  --panel-2: #e6e6e3;
  --ink: #111111;
  --muted: #74746f;
  --faint: #b9b9b4;
  --line: #e3e3df;
  --btn: #161616;
  --btn-ink: #ffffff;
  --hl: rgba(255,255,255,.4);
  --sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0b0b0b; --sheet: #141414; --panel: #1c1c1c; --panel-2: #262626; --ink: #f1f1ee; --muted: #9b9b96; --faint: #4d4d4a; --line: #2a2a2a; --btn: #f1f1ee; --btn-ink: #111111; --hl: rgba(255,255,255,.03); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0b0b0b; --sheet: #141414; --panel: #1c1c1c; --panel-2: #262626; --ink: #f1f1ee; --muted: #9b9b96; --faint: #4d4d4a; --line: #2a2a2a; --btn: #f1f1ee; --btn-ink: #111111; --hl: rgba(255,255,255,.03); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.outer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
.sheet { max-width: 1240px; margin: 0 auto; background: var(--sheet); border-radius: 32px; padding: 28px; display: grid; gap: 28px; }
@media (max-width: 560px) { .sheet { border-radius: 24px; padding: 16px; gap: 18px; } .outer { padding-block: 12px; } }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cap { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* header */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-inline: 8px; }
.bar-l { display: flex; align-items: center; gap: 28px; }
.clock { font-size: 24px; font-weight: 400; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 14px; color: var(--muted); margin-left: 4px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.brand .mark { height: 30px; width: auto; flex: none; }
.bar-r { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 20px; color: var(--muted); font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.pill:hover { color: var(--ink); }
.pill svg { width: 12px; height: 12px; }
.bar-sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); }
.iconbtn { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); display: inline-grid; place-items: center; padding: 0; }
.iconbtn:hover { border-color: var(--ink); }
.iconbtn svg { width: 20px; height: 20px; grid-area: 1 / 1; transition: opacity .2s, transform .3s; }
.iconbtn .ico-sun { opacity: 0; transform: rotate(-45deg) scale(.7); }
.iconbtn.is-dark .ico-sun { opacity: 1; transform: none; }
.iconbtn.is-dark .ico-moon { opacity: 0; transform: rotate(45deg) scale(.7); }
@media (prefers-reduced-motion: reduce) { .iconbtn svg { transition: none; } }
@media (max-width: 560px) { .clock { display: none; } .pill { padding: 7px 14px; font-size: 14px; } }

/* main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 28px; align-items: stretch; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); gap: 18px; } }
.col { display: grid; gap: 28px; align-content: start; }
@media (max-width: 900px) { .col { gap: 18px; } }

/* stage */
.stage { position: relative; background: var(--panel); border-radius: 26px; padding: 44px 44px 40px; display: flex; flex-direction: column; gap: 28px; min-height: 640px; overflow: hidden; isolation: isolate; }
.stage::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; z-index: -1;
  background:
    radial-gradient(120% 60% at 15% 100%, var(--panel-2) 0 40%, transparent 70%),
    radial-gradient(90% 50% at 85% 100%, var(--panel-2) 0 35%, transparent 70%),
    linear-gradient(to bottom, transparent, var(--panel-2)); opacity: .9; }
@media (max-width: 560px) { .stage { padding: 24px 20px 20px; min-height: 0; border-radius: 20px; } }
.stage-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.stage h1 { font-size: clamp(38px, 5.4vw, 60px); font-weight: 500; letter-spacing: -.045em; line-height: 1; text-wrap: balance; }
.stage .sub { font-size: clamp(17px, 1.8vw, 22px); color: var(--muted); font-weight: 300; line-height: 1.25; margin-top: 14px; max-width: 26ch; }
.tag { background: var(--sheet); border-radius: 999px; padding: 10px 18px; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag svg { width: 15px; height: 15px; flex: none; }

/* dropzone */
.drop { flex: 1; display: grid; place-items: center; border: 1.5px dashed var(--faint); border-radius: 20px; padding: 32px 20px; text-align: center; transition: background .2s, border-color .2s; min-height: 220px; }
.drop.over { background: var(--sheet); border-color: var(--ink); }
.drop .big { font-size: 20px; font-weight: 400; letter-spacing: -.01em; }
.drop .small { color: var(--muted); font-size: 14px; margin-top: 6px; }
.linkish { background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.drop .row { margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.loaded { flex: 1; display: grid; gap: 14px; align-content: start; min-height: 220px; }
.wave { width: 100%; height: 90px; display: block; }
.excerpt { color: var(--muted); font-size: 15px; line-height: 1.6; max-height: 160px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); white-space: pre-wrap; overflow-wrap: anywhere; }
.paste { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 16px; background: var(--sheet); padding: 16px; resize: vertical; line-height: 1.55; }
.note { font-size: 13px; color: var(--muted); }

/* inset (like the duration box) */
.inset { background: color-mix(in srgb, var(--sheet) 55%, var(--panel)); border: 1px solid var(--line); border-radius: 22px; padding: 22px 28px; display: grid; gap: 8px; box-shadow: 0 1px 0 var(--hl) inset; }
@media (max-width: 560px) { .inset { padding: 16px 18px; border-radius: 18px; } }
.inset-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.oneliner { width: 100%; border: 0; background: transparent; font-size: clamp(22px, 2.8vw, 34px); font-weight: 300; letter-spacing: -.02em; padding: 4px 0; resize: none; line-height: 1.2; min-height: 1.4em; overflow: hidden; }
.oneliner::placeholder { color: var(--faint); }
.oneliner:focus { outline: none; }
.inset:focus-within { border-color: var(--ink); }

/* side cards */
.card { border: 1px solid var(--line); border-radius: 26px; padding: 26px 28px; display: grid; gap: 14px; background: var(--sheet); }
.card.tint { background: var(--panel); border-color: transparent; }
@media (max-width: 560px) { .card { padding: 20px; border-radius: 20px; } }
.card h3 { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.card .lead { color: var(--muted); font-size: 15px; font-weight: 300; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: baseline; color: var(--muted); }
.steps li b { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--ink); }
.steps li.done { color: var(--ink); }
.steps li.done b::before { content: "✓ "; }
.status-dot { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); flex: none; display: grid; place-items: center; }
.status-dot::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); }
.status-dot.live { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.82); } }
@media (prefers-reduced-motion: reduce) { .status-dot.live { animation: none; } }
.status { display: flex; justify-content: space-between; align-items: center; gap: 16px; }

.roles { display: grid; gap: 8px; }
.role { display: grid; grid-template-columns: 18px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
.role input { appearance: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--faint); margin: 3px 0 0; display: grid; place-items: center; }
.role input:checked { border-color: var(--ink); }
.role input:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.role:has(input:checked) { background: var(--panel); border-color: var(--ink); }
.role:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.role .t { font-weight: 500; }
.role .h { font-size: 13px; color: var(--muted); }

.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.go { width: 100%; border: 0; border-radius: 999px; background: var(--btn); color: var(--btn-ink); padding: 22px 24px; font-size: 22px; font-weight: 500; letter-spacing: -.01em; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.14); text-decoration: none; }
.go::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: currentColor; opacity: .9; }
.go:disabled { opacity: .35; box-shadow: none; cursor: default; }
@media (max-width: 560px) { .go { padding: 18px; font-size: 19px; } }
.sec { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }

/* gauges */
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 900px) { .gauges { gap: 18px; } }
.gauge { border: 1px solid var(--line); border-radius: 26px; padding: 24px; display: grid; gap: 18px; justify-items: center; }
.gauge .cap { justify-self: start; }
.ring { width: 132px; height: 132px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--panel-2); }
.ring .val { stroke: var(--ink); transition: stroke-dashoffset .5s ease; }
.ring .val.soft { stroke: var(--muted); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font-size: 28px; font-weight: 400; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring .center span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
@media (max-width: 560px) { .ring { width: 104px; height: 104px; } .gauge { padding: 16px; border-radius: 20px; } }

/* tabs + drafts */
.tabs { display: inline-flex; background: var(--sheet); border-radius: 999px; padding: 4px; gap: 2px; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 9px 22px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); }
.thread { display: grid; gap: 12px; }
.post { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.post:focus-within { border-color: var(--ink); }
.post textarea { width: 100%; border: 0; background: transparent; padding: 16px 18px 6px; resize: vertical; line-height: 1.55; font-size: 15.5px; min-height: 96px; display: block; }
.post textarea:focus { outline: none; }
.post .foot { display: flex; justify-content: space-between; align-items: center; padding: 6px 18px 12px; font-size: 12px; color: var(--muted); gap: 8px; }
.post .foot .over { color: var(--ink); font-weight: 600; text-decoration: underline; }
.post.li textarea { min-height: 360px; }
.fold { margin: 0 18px; border-top: 1px dashed var(--faint); font-size: 11px; color: var(--muted); text-align: right; font-family: var(--mono); padding-top: 3px; }
.hookline { padding: 14px 18px 0; font-size: 13px; color: var(--muted); }
.hookline b { color: var(--ink); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip:hover { border-color: var(--ink); }
.chip:disabled { opacity: .45; cursor: default; }
.writing { flex: 1; display: grid; place-content: center; text-align: center; gap: 10px; min-height: 280px; color: var(--muted); }
.writing .big { font-size: 22px; color: var(--ink); font-weight: 400; }
.err { background: var(--sheet); border: 1px solid var(--ink); border-radius: 16px; padding: 14px 16px; font-size: 14px; }

/* tags */
.tagset { display: flex; flex-wrap: wrap; gap: 6px; }
.tg { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.tg[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.tg:hover { border-color: var(--ink); }
.tg .n { font-family: var(--mono); font-size: 11px; margin-left: 4px; opacity: .7; }
.field { display: grid; gap: 6px; }
.field input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; }
.field input:focus { outline: none; border-color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); }
.typed { font-size: 11px; font-family: var(--mono); color: var(--muted); }

/* library */
.lines { display: grid; gap: 0; }
.ln { padding: 22px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.ln:first-child { border-top: 0; padding-top: 4px; }
.ln q { font-size: clamp(20px, 2.4vw, 28px); font-weight: 300; letter-spacing: -.02em; line-height: 1.25; quotes: "“" "”"; }
.ln .m { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.ln .m .t { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.ln .m .ex { font-family: var(--mono); font-size: 11px; border: 1px dashed var(--faint); border-radius: 4px; padding: 0 5px; }
.ln button.linkish { font-size: 13px; color: var(--muted); }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink); border-radius: 3px; }
.filters { display: grid; gap: 10px; }
.empty-lib { flex: 1; display: grid; place-content: center; text-align: center; gap: 8px; color: var(--muted); min-height: 260px; }
.empty-lib .big { font-size: 22px; color: var(--ink); }

.switch { display: flex; justify-content: space-between; align-items: center; gap: 14px; cursor: pointer; }
.switch .t { font-weight: 500; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch i { flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--panel-2); position: relative; transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--sheet); box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.switch input:checked + i { background: var(--btn); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .switch i, .switch i::after { transition: none; } }

/* feed */
.pill[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.fcs { display: grid; }
.fc { padding: 26px 0; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.fc:first-child { border-top: 0; padding-top: 4px; }
.fc-ev { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.fc-evname { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; letter-spacing: .01em; }
.fc-evname:hover { text-decoration-color: var(--ink); }
.fc-sum { min-width: 0; }
.fc-line { font-size: clamp(22px, 2.6vw, 30px); font-weight: 300; letter-spacing: -.02em; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.fc-by { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); align-items: baseline; }
.fc-name { font-weight: 500; color: var(--ink); }
.fc-bio { min-width: 0; }
.fc-when::before { content: "· "; }
.evlist { display: grid; gap: 2px; }
.evrow { display: flex; justify-content: space-between; gap: 10px; text-align: left; background: none; border: 0; border-radius: 10px; padding: 8px 10px; margin: 0 -10px; color: var(--ink); }
.evrow:hover, .evrow[aria-pressed="true"] { background: var(--panel); }
.evrow .num { color: var(--muted); }
.modal-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(440px, 100%); background: var(--sheet); color: var(--ink); border-radius: 24px; padding: 28px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal h2 { font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.guide { display: grid; gap: 10px; }
</style>

<div class="outer">
  <div class="sheet">
    <header class="bar">
      <div class="bar-l">
        <div class="clock" id="clock" aria-hidden="true"></div>
        <div class="brand"><svg class="mark" viewBox="-20 10 900 1080" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"><path d="M285 60 C270 300 220 550 150 1030"></path><path d="M815 425 L490 452 C400 466 150 540 48 588 C18 604 60 626 120 626 C262 626 420 584 490 455"></path><path d="M818 112 C838 125 836 150 815 162 C745 200 695 270 676 370 C656 480 630 650 597 830 C585 650 582 480 600 360 C620 240 690 160 778 110 C792 102 808 104 818 112 Z" fill="currentColor" stroke-width="16"></path><path d="M598 873 Q614 962 680 978 Q614 994 598 1083 Q582 994 516 978 Q582 962 598 873 Z" fill="currentColor" stroke="none"></path></svg>Human Takeaway</div>
      </div>
      <div class="bar-r">
        <button class="pill" id="feedbtn" type="button">feed</button>
        <button class="pill" id="lib" type="button">my lines <span class="num" id="lib-n"></span></button>
        <button class="pill" id="how" type="button" aria-expanded="false">how it works <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
        <button class="pill" id="restart" type="button">new upload</button>

        <span class="bar-sep" id="theme-sep" hidden aria-hidden="true"></span>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------------- state ---------------- */
const KEY = "debrief.v2";
const INDUSTRIES = ["AI / ML", "Fintech", "Climate", "Health", "Consumer", "B2B SaaS", "Dev tools", "Crypto", "Hardware", "Media"];
const FUNCTIONS = ["Product", "Engineering", "Design", "Marketing", "Sales / GTM", "Founding", "Investing", "Ops / People"];
const blankMeta = () => ({ event: "", industries: [], functions: [], suggested: false });
const blank = () => ({ role: "job", company: "", cta: false, toFeed: false, source: null, takeaway: "", typed: false, meta: blankMeta(), out: null, tab: "x", lib: null });
const exampleLib = () => {
  const d = (n) => Date.now() - n * 86400e3;
  return [
    { id: "ex1", example: true, line: "Infra founders don't sell speed anymore. They sell fewer things that can break at 3am.", event: "AI Infra Founders Night", industries: ["AI / ML", "Dev tools"], functions: ["Founding", "Engineering"], role: "job", at: d(2) },
    { id: "ex2", example: true, line: "The best PMs tonight wrote the press release before the spec, and killed half their ideas there.", event: "Product Leaders Fireside", industries: ["B2B SaaS"], functions: ["Product"], role: "job", at: d(9) },
    { id: "ex3", example: true, line: "Climate buyers don't want a dashboard. They want someone to sign the audit.", event: "Climate Tech Mixer", industries: ["Climate"], functions: ["Sales / GTM", "Founding"], role: "job", at: d(17) }
  ];
};
let S = (() => { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { return blank(); } })();
if (!Array.isArray(S.lib)) S.lib = exampleLib();
if (!S.meta) S.meta = { ...blankMeta(), event: S.meta.event };
let filt = { industry: null, func: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ...S, source: S.source && { ...S.source, peaks: null } })); } catch {} };
// source: { kind: "text"|"audio", name, text, words, duration, peaks, pending }
let stage = "", busy = false, error = "", guideOpen = false, pasting = false, refining = false;

const ROLES = {
  job: { t: "Job seeker", h: "Show how you think, so hiring managers notice.", angle: "a job seeker. The posts should show sharp domain thinking and curiosity a hiring manager would notice. Never beg for a job and never say 'open to work'." },
  mkt: { t: "Marketer", h: "Put the spotlight on the company or product behind the event.", angle: "a marketer whose job is to get attention on the company or product in the spotlight (see SPOTLIGHT). The writer's line is the angle; the company or product is the subject. Name it naturally, show one concrete thing it lets people do or one result from the transcript, and make clear why that matters right now. Sound like a credible insider or excited user, not an ad: no slogans, no superlatives that the transcript doesn't back up. A short, light call to try or look at it is welcome at the end. Only claim features, customers and results that the transcript or the line states." },
  founder: { t: "Founder", h: "Earn trust with a clear take, without pitching.", angle: "a founder. The posts should take a clear position tied to what they are building, earning trust from customers, hires and investors, without pitching the product." },
  builder: { t: "Builder", h: "Turn what you heard into what you'd build or ship.", angle: "a builder: an engineer, designer or indie hacker who makes things. The posts connect the line to the craft: what it changes about how they would build, ship, debug or pick tools. Practical and hands-on, written from the workbench, not the stage. Mention a concrete technique, tradeoff or tool only if the transcript supports it. No product pitch." }
};

/* ---------------- Claude ---------------- */
let sampleP = null;
const getSample = () => sampleP ||= (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
const inArtifact = () => !!(window.claude && typeof window.claude.use === "function");
async function ask(prompt, { json = false, quick = false, tier = null } = {}) {
  const sample = await getSample();
  if (sample) {
    const opts = { cache: false, modelTier: tier || (quick ? "quick" : "default") };
    return json ? await sample.json(prompt, opts) : (await sample(prompt, opts)).text;
  }
  const r = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, json, quick, tier }) });
  if (!r.ok) {
    let j = {}; try { j = await r.json(); } catch {}
    // 504 with no JSON = Vercel stopped the function for running too long.
    throw { code: r.status === 504 ? "timeout" : (j.error || (r.status === 429 ? "rate_limited" : "upstream_error")), detail: j.detail || "", http: r.status };
  }
  return (await r.json()).result;
}
function errCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Writing needs permission to use Claude. Allow it from this page's permissions, then try again.";
  if (c === "rate_limited") return "Too many requests right now. Wait a minute, then try again.";
  if (c === "prompt_too_large") return "That transcript is too long. Trim it to the part that matters and try again.";
  if (c === "refused") return "Claude couldn't write from this input. Try a different line.";
  if (c === "missing_key") return "The site has no Anthropic API key. Add ANTHROPIC_API_KEY in Vercel, then redeploy.";
  if (c === "bad_key") return "The Anthropic API key was rejected. Check ANTHROPIC_API_KEY in Vercel.";
  if (c === "no_credit") return "The Anthropic account is out of credit. Add credit in the Anthropic Console.";
  if (c === "bad_model") return "The writing model isn't available to this API key. (" + (e.detail || "model not found") + ")";
  if (c === "overloaded") return "Claude is busy right now. Try again in a minute.";
  if (c === "timeout") return "Writing took longer than the server allows. Try again; a shorter transcript also helps.";
  return "Couldn't finish writing. Try again." + (c ? ` (${c}${e.http ? " " + e.http : ""}${e.detail ? ": " + String(e.detail).slice(0, 120) : ""})` : "");
}

const NO = `Never use: em dashes, "thrilled", "excited to share", "humbled", "game-changer", "delve", "unlock", "leverage", "in today's fast-paced world", "Here's the thing", "Let that sink in", "Agree?", emoji bullets. Never invent facts, names, numbers or quotes that are not in the transcript or the writer's line.`;

const PLAIN = `KEEP IT PLAIN AND HONEST.
- Cut anything obvious: if most readers would already agree without thinking, it is not worth a line.
- Cut anything that only makes sense to someone who was in the room: references to specific people, products, side debates or situations from the transcript that would need explaining. If a detail needs a sentence of context, drop it.
- No inflated stakes. Size the language to the size of the idea. Avoid "changed how I think about everything", "the future of", "this is huge", "I haven't stopped thinking about", "a masterclass", "everyone needs to hear this".
- First judge how big the writer's line really is. If it is a small, practical observation, write it small: short and casual, like telling a friend over coffee. Do not dress a small point up as a big lesson.`;

const NOT_A_SUMMARY = `THE TRANSCRIPT IS RAW MATERIAL, NOT THE SUBJECT.
- Do not summarize, recap, or report what was said. No agenda, no list of speakers, no "the panel discussed".
- The subject is the writer's one line: what THEY now believe. Use at most 1 or 2 details from the transcript, and only details a stranger would understand instantly.
- Never open with "Just attended", "Key takeaways from", "I learned that", "Yesterday at", "Great event".
- Never name the file, and never take an event name from the transcript. The only event name you may use is the one the writer typed (see EVENT below).
- Before answering, check the draft: if it reads like meeting notes, rewrite it as an opinion.

${PLAIN}`;

const X_VOICE = `VOICE: founders and tech operators who get read on X, the people building companies backed by YC, a16z or Sequoia, and the engineers, investors and operators whose posts get passed around in SF. Write in the genre, not as any one person.
- One idea, stated as a claim. They say what they believe, not what someone said.
- Compressed. Sentences of 3 to 12 words. Cut every word that doesn't carry weight.
- Concrete working vocabulary, the way people talk in Slack, not in press releases.
- Confident, takes a side when the line has one. Dry humor is welcome. Never preachy or motivational.
- Casual register. Lowercase is fine. Contractions. No corporate words.
- No hashtags, no emoji.

TONE REFERENCES (invented, for tone only; never reuse their content):
"most 'ai-native' startups are services companies with a nicer landing page. that's fine. just price it like one."
"nobody buys a model. they buy back the 3 hours a week their ops team loses to spreadsheets."
"turns out the hard part of onboarding is the first email, not the product."`;

const LI_VOICE = `VOICE: California-based LinkedIn creators with 10,000+ followers whose posts consistently earn real comments: operators, founders, PMs, recruiters and investors in SF, the Bay Area and LA. Write in the genre, not as any one person. The good ones sound like a smart person talking, not like a keynote.
- Line 1 is a short, specific, plain statement, under 12 words. Lines 1 and 2 together under 200 characters.
- Write from the writer's own experience and what they now think. The insight is the subject; the event, if mentioned at all, is a few words of setting.
- Mostly one sentence per line, with white space between ideas. A short list only if the idea truly has parts.
- Use a specific only when it directly proves the point and a stranger understands it. Never add a number or anecdote just because it is vivid.
- Warm and confident, never dramatic. Credit people only when their names are given. No humblebrag.
- Length follows the idea. A small, practical point: 300 to 700 characters, casual. A bigger idea: up to 1,500 characters. Never pad.
- No hashtags unless they are genuinely niche and useful; at most 2.

TONE REFERENCE (invented, for tone only; never reuse its content):
"Small thing I picked up this week:

The best demos I saw didn't start with the product.
They started with the spreadsheet the customer was using before.

You could see the pain in five seconds.
Then the product just had to make it go away.

Trying this in my next demo."`;


function spotlightBlock() {
  if (S.role !== "mkt") return "";
  const co = (S.company || "").trim();
  const who = co ? `SPOTLIGHT: "${co}". Use this exact name.` : "SPOTLIGHT: not given. Identify the company or product that hosted the event or is discussed most in the transcript and use its name as it appears there. If none is clear, keep the focus on the idea and name no company.";
  const tweak = "ROLE OVERRIDES: The company or product must be named in both the X post and the LinkedIn post.";
  return who + "\n" + tweak;
}

function eventBlock() {
  const ev = (S.meta.event || "").trim();
  if (!ev) return "EVENT: none given. Do not name any event. If the setting matters, describe it generically in a few words (\"a founder dinner\", \"a panel on infra\").";
  return `EVENT, as the writer typed it: "${ev}"
Decide how to use it:
- If it reads like a real, public event name people would recognize or search for (an organizer or brand plus an event, e.g. "YC Demo Day", "a16z AI infra dinner"), you may mention it once, naturally, as setting or credit. Fix capitalization; do not add words that are not implied.
- If it reads like a private label or note (dates, internal abbreviations, "session", "mtg", numbering), do not copy it. Turn it into a short natural description using only what the label and transcript make clear. Expand an abbreviation only if the transcript makes its meaning obvious; otherwise describe the setting generically.
- Never include dates from the label.
- X: mention the event only if a few words of it make the line land harder. Usually leave it out.
- LinkedIn: weave it in once as setting, ideally in the first few lines, never as the hook's subject.`;
}

function ctaRule() {
  if (!S.cta) return "ENDING: No call to action and no question to readers. Do not ask what they think, and do not tell them to try, follow, comment, DM or reach out. End on the writer's own last thought.";
  const fit = { job: "an open door to talk with people working on this", mkt: "a light nudge to try or look at the product", founder: "an invitation to people who care about this problem", builder: "an open invite to compare notes with others building the same kind of thing" }[S.role] || "a light, natural next step";
  return `ENDING: Close with one short, natural call to action: ${fit}. One line, never pushy. No "Agree?", "Thoughts?" or engagement bait. On X, keep it to a few words or fold it into the post.`;
}

function context() {
  const r = ROLES[S.role];
  const tx = S.source.text.length > 60000 ? S.source.text.slice(0, 60000) + "\n[transcript truncated]" : S.source.text;
  return `WRITER: ${r.angle}
${eventBlock()}
${spotlightBlock()}
${ctaRule()}
${S.meta.industries.length || S.meta.functions.length ? `TOPIC AREAS: ${[...S.meta.industries, ...S.meta.functions].join(", ")}` : ""}

THE WRITER'S OWN LINE (the thesis; keep its meaning, you may sharpen the wording):
"${S.takeaway}"

TRANSCRIPT:
"""${tx}"""`;
}

function planPrompt() {
  const mkt = S.role === "mkt";
  return `You are the editor who plans a social post before anyone writes it. Your job is to decide what the post argues and which few facts actually prove it. You do not write the post.

${context()}

HOW TO READ THE TRANSCRIPT
- It is auto-generated and messy: names, numbers and company names are often misheard. Never rely on a number or name unless the surrounding context makes it clearly right.
- Keep track of who said what. A speaker's story is the speaker's, not the writer's. The writer was in the audience unless the transcript clearly shows otherwise.

STEP 1. THESIS. Restate the writer's line as one plain sentence: what exactly do they claim? Then say in one sentence why it matters to someone who wasn't there.

STEP 2. SUPPORT. Find at most 2 details that directly prove or sharpen THAT claim. For each, ask:
- Does it point the same direction as the thesis? A detail that could be read as cutting against it (for example, a small team size when the claim is that the function is important) is rejected unless the post explicitly uses it as the surprising contrast that makes the point.
- Would a stranger understand it with no extra context?
- Is it reliable given the transcript errors?
- Is it vivid but off-topic? Then reject it. Being concrete is not enough; it has to carry the argument.
Zero details is a fine answer. Most strong posts use one.

STEP 3. SPINE. Outline the post as 2 to 5 beats. Each beat must follow from the previous one, and every beat must serve the thesis. No beat that only adds color.
EVENT SUMMARY. Separately, write one neutral line (under 90 characters) saying what the event or session was about, for someone who was not there: the topic and the kind of event, like "A panel on how forward-deployed engineers work with enterprise customers." Never copy dates, internal labels or abbreviations; never name people.
${mkt ? "\nSTEP 4. SPOTLIGHT. Name the company or product in the spotlight and the one concrete thing about it (from the transcript) that connects to the thesis." : ""}

Reply with only JSON:
{"event_summary":"","thesis":"","why_it_matters":"","support":[{"detail":"","said_by":"","how_it_proves_the_thesis":""}],"rejected":["vivid details you chose NOT to use, and why, briefly"],"spine":["beat 1","beat 2"]${mkt ? ',"spotlight":{"name":"","concrete_thing":""}' : ""}}`;
}

function planText(plan) {
  const p = plan || {};
  const sup = (Array.isArray(p.support) ? p.support : []).filter(x => x && x.detail);
  return `THE PLAN (approved by the editor; follow it):
Thesis: ${p.thesis || S.takeaway}
Why it matters: ${p.why_it_matters || ""}
Approved details (use only these, and none at all if the post is stronger without them):
${sup.length ? sup.map(x => `- ${x.detail}${x.said_by ? ` (said by: ${x.said_by})` : ""}. Proves: ${x.how_it_proves_the_thesis || ""}`).join("\n") : "- none"}
Spine: ${(Array.isArray(p.spine) ? p.spine : []).map((b, i) => `${i + 1}) ${b}`).join(" ")}
${p.spotlight && p.spotlight.name ? `Spotlight: ${p.spotlight.name}, ${p.spotlight.concrete_thing || ""}` : ""}
Do not bring in any other facts from the event.`;
}

const TIGHT = `MAKE IT TIGHT, LIKE A GOOD HUMAN WRITER WOULD.
Write a draft. Then check it sentence by sentence:
- Does this sentence push the thesis forward? If you delete it, does the post lose anything? If not, delete it.
- Does it follow from the sentence before it? Fix any jump in logic.
- Could any detail be read as contradicting the thesis? Remove or reframe it.
- Would a stranger understand every reference? Cut anything that needs context.
- Does it sound like a person, or like a summary? Rewrite anything that sounds generated.
Then write the final version.`;

function xPrompt(plan) {
  return `You ghostwrite X posts. ${X_VOICE}

WRITER: ${ROLES[S.role].angle}
${spotlightBlock()}
${ctaRule()}
${eventBlock()}

THE WRITER'S OWN LINE: "${S.takeaway}"

${planText(plan)}

${PLAIN}

Write ONE X post in English. Not a thread.
- It is the writer's own line, polished to sound native to X. Stay close to their words and meaning: tighten, sharpen, make it land. Do not explain it, do not add background, do not add a second idea.
- Ideally under 140 characters, never over 220. One to three short lines.
- Use an approved detail only if it makes the line hit harder. Usually use none.

${TIGHT}

${NO}

Reply with only JSON: {"draft":"","check":"what you cut or fixed, briefly","x":["the final post"]}`;
}

function liPrompt(plan) {
  return `You ghostwrite LinkedIn posts. ${LI_VOICE}

WRITER: ${ROLES[S.role].angle}
${spotlightBlock()}
${ctaRule()}
${eventBlock()}

THE WRITER'S OWN LINE: "${S.takeaway}"

${planText(plan)}

${PLAIN}

Write one LinkedIn post in English, following the spine.

${TIGHT}

${NO}

Reply with only JSON: {"draft":"","check":"what you cut or fixed, briefly","linkedin":"the final post"}`;
}

function refinePrompt(how) {
  const r = ROLES[S.role];
  const isX = S.tab === "x";
  const cur = isX ? S.out.x.join("\n\n") : S.out.linkedin;
  return `You ghostwrite ${isX ? "X posts" : "LinkedIn posts"}. ${isX ? X_VOICE : LI_VOICE}

The writer is ${r.angle}
${spotlightBlock()}
${ctaRule()}
Their own line: "${S.takeaway}".

Rewrite the draft below. Change requested: ${how}
Keep the thesis and the facts. Keep it an opinion, never a summary of an event.
${PLAIN}
${TIGHT}
 ${isX ? "One post only, not a thread, ideally under 140 characters and never over 220. Stay close to the writer's own line." : "Lines 1 and 2 together under 200 characters."}
${NO}

CURRENT:
"""${cur}"""

Reply with only JSON: ${isX ? '{"x":["the post"]}' : '{"linkedin":"the full post"}'}`;
}

async function suggestTags() {
  const s = S.source; if (!s || !s.text || S.meta.suggested) return;
  S.meta.suggested = "loading"; render();
  try {
    const r = await ask(`Classify this recording of a talk, panel or meeting.
Pick 1-2 industries ONLY from: ${INDUSTRIES.join(" | ")}
Pick 1-2 job functions ONLY from: ${FUNCTIONS.join(" | ")}
TRANSCRIPT EXCERPT:
"""${s.text.slice(0, 8000)}"""
Reply with only JSON: {"industries":[],"functions":[]}`, { json: true, quick: true });
    const pick = (arr, allowed) => (Array.isArray(arr) ? arr : []).map(String).filter(x => allowed.includes(x)).slice(0, 2);
    if (!S.meta.industries.length) S.meta.industries = pick(r && r.industries, INDUSTRIES);
    if (!S.meta.functions.length) S.meta.functions = pick(r && r.functions, FUNCTIONS);
    S.meta.suggested = true;
  } catch { S.meta.suggested = false; }
  save(); if (mode === "compose") render();
}

/* ---------------- files ---------------- */
function cleanSubs(t) {
  return t.replace(/^WEBVTT.*$/m, "")
    .split(/\r?\n/)
    .filter(l => l.trim() && !/^\d+$/.test(l.trim()) && !/-->/.test(l) && !/^(NOTE|STYLE)\b/.test(l))
    .map(l => l.replace(/<[^>]+>/g, "").trim())
    .reduce((a, l) => (a.length && a[a.length - 1] === l ? a : (a.push(l), a)), [])
    .join(" ");
}
const words = (t) => (t.trim().match(/\S+/g) || []).length;
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return [h, m, x].map(v => String(v).padStart(2, "0")).join(":"); };

async function takeFile(f) {
  if (!f) return;
  error = "";
  const isAudio = (f.type || "").startsWith("audio/") || /\.(m4a|mp3|wav|webm|ogg|aac|flac)$/i.test(f.name);
  if (!isAudio) {
    const raw = await f.text();
    const text = /\.(srt|vtt)$/i.test(f.name) ? cleanSubs(raw) : raw.trim();
    if (!text) { toast("That file is empty"); return; }
    S.source = { kind: "text", name: f.name, text, words: words(text) };
    S.out = null; S.meta = { ...blankMeta(), event: S.meta.event }; save(); render(); suggestTags(); return;
  }
  S.source = { kind: "audio", name: f.name, text: "", words: 0, duration: 0, peaks: null, pending: true };
  S.out = null; S.meta = { ...blankMeta(), event: S.meta.event }; render();
  // waveform + duration (local, no upload)
  try {
    const buf = await f.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const audio = await ctx.decodeAudioData(buf.slice(0));
    const ch = audio.getChannelData(0), n = 120, step = Math.floor(ch.length / n), peaks = [];
    for (let i = 0; i < n; i++) { let m = 0; for (let j = i * step; j < (i + 1) * step; j += 32) m = Math.max(m, Math.abs(ch[j] || 0)); peaks.push(m); }
    const max = Math.max(...peaks, .01);
    S.source.peaks = peaks.map(p => p / max); S.source.duration = audio.duration;
    try { ctx.close(); } catch {}
  } catch {}
  // transcription
  if (inArtifact()) {
    S.source.pending = false;
    S.source.note = "Audio is transcribed on the hosted version of Human Takeaway. In this preview, upload the transcript (.txt, .srt, .vtt) or paste it.";
    render(); return;
  }
  render();
  try {
    const r = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": f.type || "application/octet-stream", "X-Filename": encodeURIComponent(f.name) }, body: f });
    if (!r.ok) throw new Error(r.status === 413 ? "That audio file is too large. Keep it under 4 MB, or upload the transcript." : "Couldn't transcribe that file. Try again, or upload the transcript.");
    const { text } = await r.json();
    S.source.text = text || ""; S.source.words = words(S.source.text); S.source.pending = false;
    if (!S.source.text) S.source.note = "No speech found in that file."; else setTimeout(suggestTags, 0);
  } catch (e) { S.source.pending = false; S.source.note = e.message; }
  save(); render();
}

/* ---------------- account + storage ----------------
   artifact: claude.ai viewer account, rows in the artifact's private per-user db
   supabase: own site, Google sign-in, rows in the `lines` table (see supabase/schema.sql)
   local:    signed out or not configured, this browser only */
const Store = { kind: "local", uid: null, db: null, sb: null, email: "", configured: false };
const toRow = (x) => ({ id: x.id, line: x.line, event: x.event || "", industries: x.industries || [], functions: x.functions || [], role: x.role || "job", sourceName: x.sourceName || "", at: x.at, out: x.out || null, visibility: x.visibility || "private", eventSummary: x.eventSummary || "" });
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

const remote = {
  async list() {
    if (Store.kind === "artifact") {
      const snap = await Store.db.collection("data/users/" + Store.uid).get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.at - a.at);
    }
    if (Store.kind === "supabase") {
      const { data, error } = await Store.sb.from("lines").select("*").order("created_at", { ascending: false });
      if (error) throw error;
      return data.map(r => ({ id: r.id, line: r.line, event: r.event_title || "", industries: r.industries || [], functions: r.functions || [], role: r.role, sourceName: r.source_name || "", at: new Date(r.created_at).getTime(), out: r.posts, visibility: r.visibility, eventSummary: r.event_summary || "" }));
    }
    return null;
  },
  async add(x) {
    const r = toRow(x);
    if (Store.kind === "artifact") { const { id, ...rest } = r; await Store.db.collection("data/users/" + Store.uid).doc(id).set(rest); }
    if (Store.kind === "supabase") {
      const { error } = await Store.sb.from("lines").insert({ id: r.id, line: r.line, event_title: r.event, industries: r.industries, functions: r.functions, role: r.role, source_name: r.sourceName, created_at: new Date(r.at).toISOString(), posts: r.out, visibility: r.visibility, event_summary: (r.eventSummary || "").slice(0, 200) });
      if (error) throw error;
    }
  },
  async update(id, patch) {
    if (Store.kind === "artifact") await Store.db.collection("data/users/" + Store.uid).doc(id).update(patch);
    if (Store.kind === "supabase") { const { error } = await Store.sb.from("lines").update(patch).eq("id", id); if (error) throw error; }
  },
  async remove(id) {
    if (Store.kind === "artifact") await Store.db.collection("data/users/" + Store.uid).doc(id).delete();
    if (Store.kind === "supabase") { const { error } = await Store.sb.from("lines").delete().eq("id", id); if (error) throw error; }
  }
};
const synced = () => Store.kind !== "local";
function persist(promise, failMsg) { if (!synced()) return; promise.catch(() => toast(failMsg || "Couldn't save to your account. Check your connection.")); }

function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }

async function connectAccount() {
  if (inArtifact()) {
    const [db, user] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("user").catch(() => null)]);
    const uid = user ? await user.id() : null;
    if (db && uid) { Store.db = db; Store.uid = uid; Store.kind = "artifact"; }
  } else {
    const cfg = window.HT_CONFIG || {};
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      Store.configured = true;
      try {
        await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
        Store.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        const { data } = await Store.sb.auth.getSession();
        if (data.session) { Store.kind = "supabase"; Store.uid = data.session.user.id; Store.email = data.session.user.email || ""; }
        Store.sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && Store.kind !== "supabase") location.reload(); if (ev === "SIGNED_OUT") location.reload(); });
      } catch { Store.configured = false; }
    }
  }
  accountUI();
  if (!synced()) return;
  try {
    const rows = await remote.list();
    // move lines written in this browser before signing in
    const local = (S.lib || []).filter(x => !x.example && !rows.some(r => r.id === x.id));
    for (const x of local) await remote.add(x);
    S.lib = [...local, ...rows].sort((a, b) => b.at - a.at);
    if (!S.lib.length && !rows.length) S.lib = [];
    save(); render();
    if (local.length) toast(`Moved ${local.length} ${local.length === 1 ? "line" : "lines"} from this browser to your account`);
  } catch { toast("Couldn't load your lines from your account."); }
}

function accountUI() {
  const b = $("#acct");
  if (Store.kind === "supabase") { b.hidden = false; b.textContent = "sign out"; b.title = Store.email; }
  else if (Store.configured) { b.hidden = false; b.textContent = "sign in"; b.title = "Sign in with Google to keep your lines"; }
  else b.hidden = true;
}
/* Google sign-in. With a Google client ID configured, Google's own button signs people in on this
   page, so Google shows this site's address and the app name; the ID token is then handed to Supabase.
   Without one, it falls back to Supabase's redirect flow (Google then shows the supabase.co address). */
async function sha256hex(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
let gisReady = null;
function loadGis() { return gisReady ||= loadScript("https://accounts.google.com/gsi/client"); }
async function onAccountClick() {
  if (!Store.sb) return;
  if (Store.kind === "supabase") { await Store.sb.auth.signOut(); return; }
  const clientId = (window.HT_CONFIG || {}).googleClientId;
  if (!clientId) { await Store.sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }); return; }
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-bg" id="signin-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="signin-title">
    <h2 id="signin-title">Sign in</h2>
    <p class="hint">Keep your lines across devices and post to the Feed.</p>
    <div id="gbtn" style="min-height:44px">Loading Google…</div>
    <p class="hint" id="signin-msg"></p>
    <div class="sec" style="justify-content:flex-end"><button class="btn" type="button" id="signin-x">Cancel</button></div>
  </div></div>`;
  const close = () => { root.innerHTML = ""; };
  $("#signin-x").onclick = close;
  $("#signin-bg").addEventListener("click", (e) => { if (e.target.id === "signin-bg") close(); });
  try {
    await loadGis();
    const raw = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now();
    google.accounts.id.initialize({
      client_id: clientId, nonce: await sha256hex(raw), ux_mode: "popup", context: "signin",
      callback: async (resp) => {
        $("#signin-msg") && ($("#signin-msg").textContent = "Signing in…");
        const { error } = await Store.sb.auth.signInWithIdToken({ provider: "google", token: resp.credential, nonce: raw });
        if (error) { $("#signin-msg") && ($("#signin-msg").textContent = "Couldn't sign in: " + error.message); return; }
        close(); // onAuthStateChange reloads the page signed in
      }
    });
    $("#gbtn").textContent = "";
    const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && darkMQ && darkMQ.matches);
    google.accounts.id.renderButton($("#gbtn"), { type: "standard", theme: dark ? "filled_black" : "outline", size: "large", text: "continue_with", shape: "pill", width: 300 });
  } catch {
    $("#gbtn").textContent = "Google sign-in didn't load. Check your connection and try again.";
  }
}

/* ---------------- feed + profiles ----------------
   artifact: people/<uid> = profile, people/<uid>/posts/<id> = feed post (each person writes only their own)
   supabase: profiles + feed_posts tables (anyone reads, each person writes their own) */
const evKey = (t) => (t || "").trim().replace(/\s+/g, " ").toLowerCase();
const pendingAdds = new Map();
const Feed = {
  me: null, meLoaded: false, items: null, loading: false, error: "", event: null,
  canRead() { return Store.kind === "artifact" || !!Store.sb; },
  canPost() { return Store.kind === "artifact" || Store.kind === "supabase"; },
  async loadMe() {
    if (this.meLoaded || !this.canPost()) return this.me;
    try {
      if (Store.kind === "artifact") { const d = await Store.db.doc("people/" + Store.uid).get(); this.me = d.exists ? d.data() : null; }
      else { const { data } = await Store.sb.from("profiles").select("name,bio").eq("user_id", Store.uid).maybeSingle(); this.me = data || null; }
      this.meLoaded = true;
    } catch {}
    return this.me;
  },
  async saveMe(p) {
    const clean = { name: p.name.trim().slice(0, 50), bio: p.bio.trim().slice(0, 160) };
    if (Store.kind === "artifact") await Store.db.doc("people/" + Store.uid).set({ ...clean, updatedAt: Date.now() });
    else { const { error } = await Store.sb.from("profiles").upsert({ user_id: Store.uid, ...clean, updated_at: new Date().toISOString() }); if (error) throw error; }
    this.me = clean; this.meLoaded = true;
    if (this.items) this.items.forEach(it => { if (it.uid === Store.uid) { it.name = clean.name; it.bio = clean.bio; } });
  },
  async list() {
    if (Store.kind === "artifact") {
      const people = await Store.db.collection("people").get();
      const out = [];
      await Promise.all(people.docs.map(async (p) => {
        const prof = p.data() || {};
        const posts = await Store.db.collection(`people/${p.id}/posts`).get();
        posts.docs.forEach(d => { const x = d.data() || {}; out.push({ id: d.id, uid: p.id, line: String(x.line || ""), event: String(x.event || ""), eventSummary: String(x.eventSummary || ""), at: Number(x.at) || 0, name: String(prof.name || ""), bio: String(prof.bio || "") }); });
      }));
      return out.filter(x => x.line).sort((a, b) => b.at - a.at);
    }
    const { data, error } = await Store.sb.from("feed_posts").select("id,user_id,line,event_title,event_summary,created_at").order("created_at", { ascending: false }).limit(300);
    if (error) throw error;
    const ids = [...new Set(data.map(r => r.user_id))];
    const profs = {};
    if (ids.length) { const { data: ps } = await Store.sb.from("profiles").select("user_id,name,bio").in("user_id", ids); (ps || []).forEach(p => profs[p.user_id] = p); }
    return data.map(r => ({ id: r.id, uid: r.user_id, line: r.line, event: r.event_title || "", eventSummary: r.event_summary || "", at: new Date(r.created_at).getTime(), name: (profs[r.user_id] || {}).name || "", bio: (profs[r.user_id] || {}).bio || "" }));
  },
  async add(entry) {
    const post = { line: entry.line, event: entry.event || "", eventSummary: entry.eventSummary || "", at: Date.now() };
    if (Store.kind === "artifact") await Store.db.doc(`people/${Store.uid}/posts/${entry.id}`).set(post);
    else {
      await (pendingAdds.get(entry.id) || Promise.resolve());
      const { error } = await Store.sb.from("feed_posts").insert({ id: entry.id, line: post.line, event_title: post.event.slice(0, 80), event_summary: post.eventSummary.slice(0, 200) });
      if (error) throw error;
    }
    if (this.items) this.items.unshift({ id: entry.id, uid: Store.uid, ...post, name: this.me?.name || "", bio: this.me?.bio || "" });
  },
  async remove(id) {
    if (Store.kind === "artifact") await Store.db.doc(`people/${Store.uid}/posts/${id}`).delete();
    else { const { error } = await Store.sb.from("feed_posts").delete().eq("id", id); if (error) throw error; }
    if (this.items) this.items = this.items.filter(x => x.id !== id);
  }
};

async function refreshFeed() {
  if (!Feed.canRead()) return;
  Feed.loading = true; Feed.error = ""; if (mode === "feed") render();
  try { Feed.items = await Feed.list(); } catch { Feed.error = "Couldn't load the Feed. Try again in a moment."; }
  Feed.loading = false; if (mode === "feed") render();
}

function askProfile(title) {
  return new Promise((resolve) => {
    const root = $("#modal-root"), me = Feed.me || { name: "", bio: "" };
    root.innerHTML = `<div class="modal-bg"><form class="modal" id="prof-form" role="dialog" aria-modal="true" aria-labelledby="prof-title">
      <h2 id="prof-title">${esc(title || "Your Feed profile")}</h2>
      <p class="hint">Shown next to your lines on the Feed.</p>
      <div class="field"><label for="prof-name" class="hint">Name</label><input id="prof-name" type="text" maxlength="50" required value="${esc(me.name)}" placeholder="June Lim"></div>
      <div class="field"><label for="prof-bio" class="hint">Bio</label><input id="prof-bio" type="text" maxlength="160" value="${esc(me.bio)}" placeholder="PM in SF. Writing about AI infra and dev tools."><span class="hint" id="prof-n">${me.bio.length}/160</span></div>
      <div class="sec" style="justify-content:flex-end"><button class="btn" type="button" id="prof-cancel">Cancel</button><button class="btn primary" type="submit" id="prof-save">Save</button></div>
    </form></div>`;
    const close = (v) => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = (e) => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", onKey);
    $("#prof-cancel").onclick = () => close(null);
    $("#prof-bio").oninput = (e) => { $("#prof-n").textContent = e.target.value.length + "/160"; };
    $("#prof-form").onsubmit = async (e) => {
      e.preventDefault();
      const name = $("#prof-name").value.trim(); if (!name) { $("#prof-name").focus(); return; }
      $("#prof-save").disabled = true;
      try { await Feed.saveMe({ name, bio: $("#prof-bio").value }); close(Feed.me); }
      catch { $("#prof-save").disabled = false; toast("Couldn't save your profile. Try again."); }
    };
    setTimeout(() => $("#prof-name")?.focus(), 30);
  });
}

async function postToFeed(entry, quiet) {
  if (!Feed.canPost()) { toast(Store.configured ? "Sign in to post to the Feed" : "The Feed needs an account"); return false; }
  await Feed.loadMe();
  if (!Feed.me || !Feed.me.name) { const p = await askProfile("Set up your Feed profile"); if (!p) return false; }
  try {
    await Feed.add(entry);
    entry.visibility = "public"; save(); persist(remote.update(entry.id, { visibility: "public" }));
    if (!quiet) toast("Posted to the Feed");
    if (mode === "library" || mode === "feed") render();
    return true;
  } catch { toast("Couldn't post to the Feed. Try again."); return false; }
}
async function removeFromFeed(entry) {
  try {
    await Feed.remove(entry.id);
    entry.visibility = "private"; save(); persist(remote.update(entry.id, { visibility: "private" }));
    toast("Removed from the Feed"); render();
  } catch { toast("Couldn't remove it. Try again."); }
}

function feedSwitch(id) {
  return `<label class="switch" for="${id}"><span><span class="t">Post to Feed</span><br><span class="hint">${S.toFeed ? "Your line and the event go to the Feed with your name." : "Off: your line stays private."}</span></span><input type="checkbox" role="switch" id="${id}" data-tofeed ${S.toFeed ? "checked" : ""} ${busy ? "disabled" : ""}><i aria-hidden="true"></i></label>`;
}

function feedCard(x, withEvent) {
  const when = new Date(x.at).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const evTitle = x.event.trim();
  const head = withEvent && (evTitle || x.eventSummary)
    ? `<div class="fc-ev">${evTitle ? `<button class="fc-evname" type="button" data-ev="${esc(evKey(evTitle))}">${esc(evTitle)}</button>` : ""}${x.eventSummary ? `<span class="fc-sum">${esc(x.eventSummary)}</span>` : ""}</div>` : "";
  return `<article class="fc">${head}<p class="fc-line">“${esc(x.line)}”</p>
    <div class="fc-by"><span class="fc-name">${esc(x.name || "Someone")}</span>${x.bio ? `<span class="fc-bio">${esc(x.bio)}</span>` : ""}<span class="fc-when">${esc(when)}</span></div></article>`;
}

function feedEvents() {
  const groups = new Map();
  (Feed.items || []).forEach(x => { const k = evKey(x.event); if (!k) return; const g = groups.get(k) || { key: k, title: x.event.trim(), summary: "", n: 0, last: 0 }; g.n++; g.last = Math.max(g.last, x.at); if (!g.summary && x.eventSummary) g.summary = x.eventSummary; groups.set(k, g); });
  return [...groups.values()].sort((a, b) => b.n - a.n || b.last - a.last);
}

function feedView() {
  const items = Feed.items || [];
  const ev = Feed.event ? feedEvents().find(g => g.key === Feed.event) : null;
  const shown = ev ? items.filter(x => evKey(x.event) === ev.key) : items;
  let body;
  if (!Feed.canRead()) body = `<div class="empty-lib"><div class="big">The Feed needs an account</div><div>Lines on the Feed come from signed-in people.</div></div>`;
  else if (Feed.loading && !Feed.items) body = `<div class="empty-lib"><div>Loading the Feed…</div></div>`;
  else if (Feed.error && !Feed.items) body = `<div class="empty-lib"><div class="big">Feed unavailable</div><div>${esc(Feed.error)}</div><div class="sec" style="justify-content:center"><button class="btn" type="button" data-feed-refresh>Try again</button></div></div>`;
  else if (!shown.length) body = `<div class="empty-lib"><div class="big">Nothing here yet</div><div>Turn on "Post to Feed" when you write, or post a line from My lines.</div></div>`;
  else body = `<div class="fcs">${shown.map(x => feedCard(x, !ev)).join("")}</div>`;
  const events = feedEvents();
  const me = Feed.me;
  return `
  <section class="stage" aria-label="Feed">
    <div class="stage-top">
      <div>${ev ? `<button class="linkish" type="button" data-ev="" style="margin-bottom:14px">← All of the Feed</button><h1>${esc(ev.title)}</h1><p class="sub">${ev.summary ? esc(ev.summary) : "What people took away."}</p><p class="hint" style="margin-top:10px">${ev.n} ${ev.n === 1 ? "line" : "lines"} from this event</p>` : `<h1>What stayed with people.</h1><p class="sub">One line each, from the events people went to.</p>`}</div>
    </div>
    ${body}
  </section>
  <aside class="col">
    ${Feed.canPost() ? `<div class="card tint"><div class="cap">Your profile</div>${me && me.name ? `<div><div class="fc-name" style="font-size:18px">${esc(me.name)}</div>${me.bio ? `<p class="lead" style="margin-top:4px">${esc(me.bio)}</p>` : ""}</div>` : `<p class="lead">Add a name and a short bio to post on the Feed.</p>`}<div class="sec"><button class="btn" type="button" data-prof-edit>${me && me.name ? "Edit profile" : "Set up profile"}</button></div></div>` : ""}
    <div class="card"><div class="cap">Events</div>${events.length ? `<div class="evlist">${events.slice(0, 20).map(g => `<button type="button" class="evrow" data-ev="${esc(g.key)}" aria-pressed="${Feed.event === g.key}"><span>${esc(g.title)}</span><span class="num">${g.n}</span></button>`).join("")}</div>` : `<p class="hint">Events show up here as people post.</p>`}<div class="sec"><button class="btn" type="button" data-feed-refresh ${Feed.loading ? "disabled" : ""}>${Feed.loading ? "Refreshing…" : "Refresh"}</button></div></div>
  </aside>`;
}

function bindFeed() {
  document.querySelectorAll("[data-ev]").forEach(b => b.addEventListener("click", () => { Feed.event = b.dataset.ev || null; mode = "feed"; render(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-feed-refresh]").forEach(b => b.addEventListener("click", refreshFeed));
  document.querySelectorAll("[data-prof-edit]").forEach(b => b.addEventListener("click", async () => { await Feed.loadMe(); const p = await askProfile(); if (p) { toast("Profile saved"); render(); } }));
  document.querySelectorAll("[data-tofeed]").forEach(c => c.addEventListener("change", async () => {
    if (c.checked && !Feed.canPost()) { c.checked = false; toast(Store.configured ? "Sign in to post to the Feed" : "The Feed needs an account"); return; }
    if (c.checked) { await Feed.loadMe(); if (!Feed.me || !Feed.me.name) { const p = await askProfile("Set up your Feed profile"); if (!p) { c.checked = false; return; } } }
    S.toFeed = c.checked; save(); render();
  }));
  document.querySelectorAll("[data-feedpost]").forEach(b => b.addEventListener("click", async () => {
    const it = S.lib.find(x => x.id === b.dataset.feedpost); if (!it) return;
    b.disabled = true;
    if (it.visibility === "public") await removeFromFeed(it); else await postToFeed(it);
    b.disabled = false;
  }));
}

/* ---------------- render ---------------- */
const ready = () => !!(S.source && S.source.text && S.takeaway.trim());
const toast = (m) => { const r = $("#toast-root"); r.innerHTML = `<div class="toast">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2400); };

function ring(v, max, label, unit, soft) {
  const r = 58, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, max ? v / max : 0));
  return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="track" cx="66" cy="66" r="${r}" fill="none" stroke-width="5"/><circle class="val ${soft ? "soft" : ""}" cx="66" cy="66" r="${r}" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>
    <div class="center"><b>${esc(label)}</b><span>${esc(unit)}</span></div></div>`;
}

function sourceBlock() {
  const s = S.source;
  if (pasting || (s && s.name === "Pasted transcript")) {
    return `<label class="sr" for="paste">Transcript</label><textarea class="paste" id="paste" placeholder="Paste or type the transcript here">${esc(s && s.name === "Pasted transcript" ? s.text : "")}</textarea>`;
  }
  if (!s) {
    return `<div class="drop" id="drop"><div>
      <div class="big">Drop a recording or its transcript here</div>
      <div class="small">Audio (.m4a, .mp3, .wav) or text (.txt, .srt, .vtt)</div>
      <div class="row"><button class="btn" id="browse" type="button">Choose file</button><button class="btn" id="paste-btn" type="button">Paste text</button></div>
    </div></div>`;
  }
  let h = `<div class="loaded">`;
  if (s.kind === "audio") h += `<canvas class="wave" id="wave" aria-label="Waveform of ${esc(s.name)}"></canvas>`;
  if (s.pending) h += `<div class="note">Transcribing… this takes about a quarter of the recording's length.</div>`;
  if (s.text) h += `<div class="excerpt">${esc(s.text.slice(0, 900))}</div>`;
  if (s.note) h += `<div class="note">${esc(s.note)}</div><div class="sec"><button class="btn" id="browse" type="button">Upload transcript</button><button class="btn" id="paste-btn" type="button">Paste text</button></div>`;
  else h += `<div class="sec"><button class="btn" id="browse" type="button">Replace file</button></div>`;
  return h + `</div>`;
}

  return `

    </div>
    ${guideOpen ? guideCard() : ""}
    ${metaCard()}
    <fieldset class="card" style="margin:0">
      <legend class="sr">Who you are writing as</legend>
      <div class="cap">Writing as</div>
      <div class="roles">${Object.entries(ROLES).map(([k, r]) => `<label class="role"><input type="radio" name="role" value="${k}" ${S.role === k ? "checked" : ""}><span><span class="t">${r.t}</span><br><span class="h">${r.h}</span></span></label>`).join("")}</div>
      ${S.role === "mkt" ? `<div class="field"><label for="co" class="hint">Company or product to spotlight</label><input id="co" type="text" maxlength="60" value="${esc(S.company || "")}" placeholder="e.g. Lovable"><span class="hint">Leave blank to use the host or the company talked about most.</span></div>` : ""}

function ctaSwitch(id) {

function metaCard() {

}

function guideCard() {
