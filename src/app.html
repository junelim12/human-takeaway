<style>
/* Layout: one rounded app sheet; a large stage panel on the left (upload, then the drafts), a narrow column of instrument cards on the right. Monochrome only. */
:root {

}
@media (prefers-color-scheme: dark) {

    --page: #0b0b0b; --sheet: #141414; --panel: #1c1c1c; --panel-2: #262626; --ink: #f1f1ee; --muted: #9b9b96; --faint: #4d4d4a; --line: #2a2a2a; --btn: #f1f1ee; --btn-ink: #111111; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0b0b0b; --sheet: #141414; --panel: #1c1c1c; --panel-2: #262626; --ink: #f1f1ee; --muted: #9b9b96; --faint: #4d4d4a; --line: #2a2a2a; --btn: #f1f1ee; --btn-ink: #111111; color-scheme: dark;
}

@media (max-width: 560px) { .sheet { border-radius: 24px; padding: 16px; gap: 18px; } .outer { padding-block: 12px; } }
h1, h2, h3, p { margin: 0; }

.brand i::after { content: ""; position: absolute; right: -3px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--panel-2); }

.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 20px; color: var(--muted); font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }

.paste { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 16px; background: var(--sheet); padding: 16px; resize: vertical; line-height: 1.55; }

.oneliner::placeholder { color: var(--faint); }
.oneliner:focus { outline: none; }
.inset:focus-within { border-color: var(--ink); }

/* side cards */
.card { border: 1px solid var(--line); border-radius: 26px; padding: 26px 28px; display: grid; gap: 14px; background: var(--sheet); }
.card.tint { background: var(--panel); border-color: transparent; }
@media (max-width: 560px) { .card { padding: 20px; border-radius: 20px; } }

.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: baseline; color: var(--muted); }
.steps li b { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--ink); }
.steps li.done { color: var(--ink); }

.status-dot { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); flex: none; display: grid; place-items: center; }
.status-dot::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); }
.status-dot.live { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(.82); } }
@media (prefers-reduced-motion: reduce) { .status-dot.live { animation: none; } }
.status { display: flex; justify-content: space-between; align-items: center; gap: 16px; }

.roles { display: grid; gap: 8px; }

.role input { appearance: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--faint); margin: 3px 0 0; display: grid; place-items: center; }
.role input:checked { border-color: var(--ink); }

.role:has(input:checked) { background: var(--panel); border-color: var(--ink); }
.role:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.role .t { font-weight: 500; }
.role .h { font-size: 13px; color: var(--muted); }

.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; flex-wrap: wrap; }
.go { width: 100%; border: 0; border-radius: 999px; background: var(--btn); color: var(--btn-ink); padding: 22px 24px; font-size: 22px; font-weight: 500; letter-spacing: -.01em; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.14); text-decoration: none; }

@media (max-width: 560px) { .go { padding: 18px; font-size: 19px; } }
.sec { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }

/* gauges */
.gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 900px) { .gauges { gap: 18px; } }
.gauge { border: 1px solid var(--line); border-radius: 26px; padding: 24px; display: grid; gap: 18px; justify-items: center; }

.ring { width: 132px; height: 132px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--panel-2); }
.ring .val { stroke: var(--ink); transition: stroke-dashoffset .5s ease; }

.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .center b { font-size: 28px; font-weight: 400; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* tabs + drafts */

.tabs button[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); }

.post:focus-within { border-color: var(--ink); }

.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip:hover { border-color: var(--ink); }

.writing { flex: 1; display: grid; place-content: center; text-align: center; gap: 10px; min-height: 280px; color: var(--muted); }
.writing .big { font-size: 22px; color: var(--ink); font-weight: 400; }
.err { background: var(--sheet); border: 1px solid var(--ink); border-radius: 16px; padding: 14px 16px; font-size: 14px; }

/* tags */
.tagset { display: flex; flex-wrap: wrap; gap: 6px; }
.tg { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.tg[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.tg:hover { border-color: var(--ink); }

.field { display: grid; gap: 6px; }
.field input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; }

.hint { font-size: 12px; color: var(--muted); }
.typed { font-size: 11px; font-family: var(--mono); color: var(--muted); }

/* library */
.lines { display: grid; gap: 0; }
.ln { padding: 22px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.ln:first-child { border-top: 0; padding-top: 4px; }
.ln q { font-size: clamp(20px, 2.4vw, 28px); font-weight: 300; letter-spacing: -.02em; line-height: 1.25; quotes: "“" "”"; }
.ln .m { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.ln .m .t { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.ln .m .ex { font-family: var(--mono); font-size: 11px; border: 1px dashed var(--faint); border-radius: 4px; padding: 0 5px; }
.ln button.linkish { font-size: 13px; color: var(--muted); }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
.bar .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink); border-radius: 3px; }
.filters { display: grid; gap: 10px; }
.empty-lib { flex: 1; display: grid; place-content: center; text-align: center; gap: 8px; color: var(--muted); min-height: 260px; }
.empty-lib .big { font-size: 22px; color: var(--ink); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ---------------- state ---------------- */
const KEY = "debrief.v2";
const INDUSTRIES = ["AI / ML", "Fintech", "Climate", "Health", "Consumer", "B2B SaaS", "Dev tools", "Crypto", "Hardware", "Media"];
const FUNCTIONS = ["Product", "Engineering", "Design", "Marketing", "Sales / GTM", "Founding", "Investing", "Ops / People"];
const blankMeta = () => ({ event: "", industries: [], functions: [], suggested: false });
const blank = () => ({ role: "job", source: null, takeaway: "", typed: false, meta: blankMeta(), out: null, tab: "x", lib: null });
const exampleLib = () => {
  const d = (n) => Date.now() - n * 86400e3;
  return [
    { id: "ex1", example: true, line: "Infra founders don't sell speed anymore. They sell fewer things that can break at 3am.", event: "AI Infra Founders Night", industries: ["AI / ML", "Dev tools"], functions: ["Founding", "Engineering"], role: "job", at: d(2) },
    { id: "ex2", example: true, line: "The best PMs tonight wrote the press release before the spec, and killed half their ideas there.", event: "Product Leaders Fireside", industries: ["B2B SaaS"], functions: ["Product"], role: "job", at: d(9) },
    { id: "ex3", example: true, line: "Climate buyers don't want a dashboard. They want someone to sign the audit.", event: "Climate Tech Mixer", industries: ["Climate"], functions: ["Sales / GTM", "Founding"], role: "job", at: d(17) }
  ];
};
let S = (() => { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch { return blank(); } })();
if (!Array.isArray(S.lib)) S.lib = exampleLib();
if (!S.meta) S.meta = blankMeta();
let filt = { industry: null, func: null };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ...S, source: S.source && { ...S.source, peaks: null } })); } catch {} };
// source: { kind: "text"|"audio", name, text, words, duration, peaks, pending }
let busy = false, error = "", guideOpen = false, pasting = false, refining = false;

const ROLES = {
  job: { t: "Job seeker", h: "Show how you think, so hiring managers notice.", angle: "a job seeker. The posts should show sharp domain thinking and curiosity a hiring manager would notice. Never beg for a job and never say 'open to work'." },
  mkt: { t: "Marketer", h: "Turn the talk into a point of view your audience shares.", angle: "a marketer. The posts should give a clear, useful point of view the audience will want to share, with concrete examples. No campaign-speak, no slogans." },
  founder: { t: "Founder", h: "Earn trust with a clear take, without pitching.", angle: "a founder. The posts should take a clear position tied to what they are building, earning trust from customers, hires and investors, without pitching the product." }
};

/* ---------------- Claude ---------------- */
let sampleP = null;
const getSample = () => sampleP ||= (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
const inArtifact = () => !!(window.claude && typeof window.claude.use === "function");
async function ask(prompt, { json = false, quick = false } = {}) {
  const sample = await getSample();
  if (sample) {
    const opts = { cache: false, modelTier: quick ? "quick" : "default" };
    return json ? await sample.json(prompt, opts) : (await sample(prompt, opts)).text;
  }
  const r = await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, json, quick }) });
  if (!r.ok) throw { code: r.status === 429 ? "rate_limited" : "upstream_error" };
  return (await r.json()).result;
}
function errCopy(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled") return "Writing needs permission to use Claude. Allow it from this page's permissions, then try again.";
  if (c === "rate_limited") return "Too many requests right now. Wait a minute, then try again.";
  if (c === "prompt_too_large") return "That transcript is too long. Trim it to the part that matters and try again.";
  if (c === "refused") return "Claude couldn't write from this input. Try a different line.";
  return "Couldn't finish writing. Try again.";
}

const NO = `Never use: em dashes, "thrilled", "excited to share", "game-changer", "delve", "unlock", "leverage", "in today's fast-paced world", "Here's the thing", "Let that sink in", emoji bullets. Never invent facts, names, numbers or quotes that are not in the transcript.`;

function mainPrompt() {
  const r = ROLES[S.role];
  const tx = S.source.text.length > 60000 ? S.source.text.slice(0, 60000) + "\n[transcript truncated]" : S.source.text;
  return `You turn recorded talks, meetings and conversations into social posts written in the voice of the person who was there.

WRITER: ${r.angle}
${S.meta.event ? `EVENT: ${S.meta.event} (mention it by name once)` : ""}
${S.meta.industries.length || S.meta.functions.length ? `TOPIC AREAS: ${[...S.meta.industries, ...S.meta.functions].join(", ")}` : ""}

THEIR ONE LINE (the thesis of everything you write; keep its meaning, you may sharpen the wording):
"${S.takeaway}"

TRANSCRIPT (source of specifics: moments, quotes, numbers, names):
"""${tx}"""

Write two things in English, first person, plain spoken, specific over grand.

1. X: a thread of 3 to 5 posts. Post 1 must stand alone and make people stop scrolling; it states the line in a fresh way. Each post at most 270 characters. No hashtags. No "1/" numbering. Last post ends with a question or a crisp closing thought.

2. LinkedIn: one post of 150 to 230 words. The first two lines decide whether anyone clicks "see more", so keep them under 200 characters and make them concrete. Short paragraphs of one or two sentences with a blank line between. End with one genuine question. At most 3 hashtags on the final line, or none.

${NO}

Reply with only JSON: {"x":["post 1","post 2",...],"linkedin":"the full post"}`;
}
function refinePrompt(how) {
  const r = ROLES[S.role];
  const isX = S.tab === "x";
  const cur = isX ? S.out.x.map((p, i) => `[${i + 1}] ${p}`).join("\n\n") : S.out.linkedin;
  return `Rewrite this ${isX ? "X thread" : "LinkedIn post"} written by ${r.angle}
Their one line: "${S.takeaway}".
Change requested: ${how}
Keep the same thesis and facts. ${isX ? "Each post at most 270 characters, no hashtags, no numbering." : "First two lines under 200 characters, short paragraphs, a closing question."}
${NO}

CURRENT:
"""${cur}"""

Reply with only JSON: ${isX ? '{"x":["post 1","post 2",...]}' : '{"linkedin":"the full post"}'}`;
}

async function suggestTags() {
  const s = S.source; if (!s || !s.text || S.meta.suggested) return;
  S.meta.suggested = "loading"; render();
  try {
    const r = await ask(`Classify this recording of a talk, panel or meeting.
Pick 1-2 industries ONLY from: ${INDUSTRIES.join(" | ")}
Pick 1-2 job functions ONLY from: ${FUNCTIONS.join(" | ")}
If the event's name is stated in the text, give it; otherwise "".
TRANSCRIPT EXCERPT:
"""${s.text.slice(0, 8000)}"""
Reply with only JSON: {"event":"","industries":[],"functions":[]}`, { json: true, quick: true });
    const pick = (arr, allowed) => (Array.isArray(arr) ? arr : []).map(String).filter(x => allowed.includes(x)).slice(0, 2);
    if (!S.meta.industries.length) S.meta.industries = pick(r && r.industries, INDUSTRIES);
    if (!S.meta.functions.length) S.meta.functions = pick(r && r.functions, FUNCTIONS);
    if (!S.meta.event && r && r.event) S.meta.event = String(r.event).slice(0, 80);
    S.meta.suggested = true;
  } catch { S.meta.suggested = false; }
  save(); if (mode === "compose") render();
}

/* ---------------- files ---------------- */
function cleanSubs(t) {
  return t.replace(/^WEBVTT.*$/m, "")
    .split(/\r?\n/)
    .filter(l => l.trim() && !/^\d+$/.test(l.trim()) && !/-->/.test(l) && !/^(NOTE|STYLE)\b/.test(l))
    .map(l => l.replace(/<[^>]+>/g, "").trim())
    .reduce((a, l) => (a.length && a[a.length - 1] === l ? a : (a.push(l), a)), [])
    .join(" ");
}
const words = (t) => (t.trim().match(/\S+/g) || []).length;
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return [h, m, x].map(v => String(v).padStart(2, "0")).join(":"); };

async function takeFile(f) {
  if (!f) return;
  error = "";
  const isAudio = (f.type || "").startsWith("audio/") || /\.(m4a|mp3|wav|webm|ogg|aac|flac)$/i.test(f.name);
  if (!isAudio) {
    const raw = await f.text();
    const text = /\.(srt|vtt)$/i.test(f.name) ? cleanSubs(raw) : raw.trim();
    if (!text) { toast("That file is empty"); return; }
    S.source = { kind: "text", name: f.name, text, words: words(text) };
    S.out = null; S.meta = blankMeta(); save(); render(); suggestTags(); return;
  }
  S.source = { kind: "audio", name: f.name, text: "", words: 0, duration: 0, peaks: null, pending: true };
  S.out = null; S.meta = blankMeta(); render();
  // waveform + duration (local, no upload)
  try {
    const buf = await f.arrayBuffer();
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const audio = await ctx.decodeAudioData(buf.slice(0));
    const ch = audio.getChannelData(0), n = 120, step = Math.floor(ch.length / n), peaks = [];
    for (let i = 0; i < n; i++) { let m = 0; for (let j = i * step; j < (i + 1) * step; j += 32) m = Math.max(m, Math.abs(ch[j] || 0)); peaks.push(m); }
    const max = Math.max(...peaks, .01);
    S.source.peaks = peaks.map(p => p / max); S.source.duration = audio.duration;
    try { ctx.close(); } catch {}
  } catch {}
  // transcription
  if (inArtifact()) {
    S.source.pending = false;
    S.source.note = "Audio is transcribed on the hosted version of Human Takeaway. In this preview, upload the transcript (.txt, .srt, .vtt) or paste it.";
    render(); return;
  }
  render();
  try {
    const r = await fetch("/api/transcribe", { method: "POST", headers: { "Content-Type": f.type || "application/octet-stream", "X-Filename": encodeURIComponent(f.name) }, body: f });
    if (!r.ok) throw new Error(r.status === 413 ? "That audio file is too large. Keep it under 4 MB, or upload the transcript." : "Couldn't transcribe that file. Try again, or upload the transcript.");
    const { text } = await r.json();
    S.source.text = text || ""; S.source.words = words(S.source.text); S.source.pending = false;
    if (!S.source.text) S.source.note = "No speech found in that file."; else setTimeout(suggestTags, 0);
  } catch (e) { S.source.pending = false; S.source.note = e.message; }
  save(); render();
}

/* ---------------- render ---------------- */
const ready = () => !!(S.source && S.source.text && S.takeaway.trim());
const toast = (m) => { const r = $("#toast-root"); r.innerHTML = `<div class="toast">${esc(m)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2400); };

function ring(v, max, label, unit, soft) {
  const r = 58, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, max ? v / max : 0));
  return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="track" cx="66" cy="66" r="${r}" fill="none" stroke-width="5"/><circle class="val ${soft ? "soft" : ""}" cx="66" cy="66" r="${r}" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>
    <div class="center"><b>${esc(label)}</b><span>${esc(unit)}</span></div></div>`;
}

function sourceBlock() {
  const s = S.source;
  if (pasting) {
    return `<label class="sr" for="paste">Paste transcript</label><textarea class="paste" id="paste" placeholder="Paste the transcript here">${esc(s && s.kind === "text" && s.name === "Pasted transcript" ? s.text : "")}</textarea>
      <div class="sec"><button class="btn" id="paste-ok" type="button">Use this text</button><button class="btn" id="paste-x" type="button">Cancel</button></div>`;
  }
  if (!s) {
    return `<div class="drop" id="drop"><div>
      <div class="big">Drop a recording or its transcript here</div>
      <div class="small">Audio (.m4a, .mp3, .wav) or text (.txt, .srt, .vtt)</div>
      <div class="row"><button class="btn" id="browse" type="button">Choose file</button><button class="btn" id="paste-btn" type="button">Paste text</button></div>
    </div></div>`;
  }
  let h = `<div class="loaded">`;
  if (s.kind === "audio") h += `<canvas class="wave" id="wave" aria-label="Waveform of ${esc(s.name)}"></canvas>`;
  if (s.pending) h += `<div class="note">Transcribing… this takes about a quarter of the recording's length.</div>`;
  if (s.text) h += `<div class="excerpt">${esc(s.text.slice(0, 900))}</div>`;
  if (s.note) h += `<div class="note">${esc(s.note)}</div><div class="sec"><button class="btn" id="browse" type="button">Upload transcript</button><button class="btn" id="paste-btn" type="button">Paste text</button></div>`;
  else h += `<div class="sec"><button class="btn" id="browse" type="button">Replace file</button></div>`;
  return h + `</div>`;
}

let mode = S.out ? "result" : "compose";
function render() {
  const main = $("#main");
  const focusId = document.activeElement && document.activeElement.id;
  main.innerHTML = mode === "result" ? resultView() : mode === "library" ? libraryView() : composeView();
  $("#lib-n").textContent = S.lib.length ? S.lib.length : "";
  bind();
  if (focusId && $("#" + focusId)) { const el = $("#" + focusId); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
  drawWave();
}

function drawWave() {
  const c = $("#wave"); const s = S.source;
  if (!c || !s || !s.peaks) return;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#111";
  const n = s.peaks.length, gap = 3, bw = Math.max(2, (w - gap * (n - 1)) / n);
  g.fillStyle = ink;
  s.peaks.forEach((p, i) => { const bh = Math.max(3, p * h * .9); const x = i * (bw + gap); g.globalAlpha = .25 + p * .75; g.beginPath(); g.roundRect ? g.roundRect(x, (h - bh) / 2, bw, bh, bw / 2) : g.rect(x, (h - bh) / 2, bw, bh); g.fill(); });
}

function bind() {
  // compose
  $("#browse")?.addEventListener("click", () => $("#file").click());
  $("#paste-btn")?.addEventListener("click", () => { pasting = true; render(); $("#paste")?.focus(); });
  $("#paste-x")?.addEventListener("click", () => { pasting = false; render(); });
  $("#paste-ok")?.addEventListener("click", () => {
    const t = $("#paste").value.trim(); if (!t) { toast("Paste some text first"); return; }
    S.source = { kind: "text", name: "Pasted transcript", text: t, words: words(t) }; pasting = false; S.out = null; S.meta = blankMeta(); save(); render(); suggestTags();
  });
  const drop = $("#drop");
  if (drop) {
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => takeFile(e.dataTransfer.files[0]));
  }
  const line = $("#line");
  if (line) {
    const fit = () => { line.style.height = "auto"; line.style.height = line.scrollHeight + "px"; };
    fit();
    line.addEventListener("input", () => {
      S.takeaway = line.value; save(); fit();
      const cnt = line.closest(".inset").querySelector(".note"); cnt.textContent = line.value.length + "/140";
      $("#go").disabled = !ready() || busy;
      const r = document.querySelector(".meta .num"); if (r) r.textContent = [!!(S.source && S.source.text), !!S.takeaway.trim(), true].filter(Boolean).length + "/3 ready";
    });
    const nope = (e) => { e.preventDefault(); const h = $("#line-hint"); h.textContent = "Pasting is off for this line. Type it in your own words."; h.style.color = "var(--ink)"; toast("Type this one yourself"); };
    line.addEventListener("paste", nope);
    line.addEventListener("drop", nope);
    line.addEventListener("beforeinput", e => { if (e.inputType === "insertFromPaste" || e.inputType === "insertFromDrop" || e.inputType === "insertFromPasteAsQuotation") nope(e); });
    line.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); if (ready()) write(); } });
  }
  document.querySelectorAll('input[name="role"]').forEach(r => r.addEventListener("change", () => { S.role = r.value; save(); }));
  $("#go")?.addEventListener("click", write);
  $("#ev")?.addEventListener("input", e => { S.meta.event = e.target.value; save(); });
  document.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.tag === "ind" ? "industries" : "functions", v = b.dataset.v, arr = S.meta[key];
    const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v);
    b.setAttribute("aria-pressed", String(i < 0)); save();
  }));

  // library
  document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.f, v = b.dataset.v; filt[k] = filt[k] === v ? null : v; render();
  }));
  document.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => { filt = { industry: null, func: null }; render(); }));
  $("#ex-clear")?.addEventListener("click", () => { S.lib = S.lib.filter(x => !x.example); filt = { industry: null, func: null }; save(); render(); toast("Examples removed"); });
  $("#lib-new")?.addEventListener("click", () => { mode = "compose"; render(); });
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
    const it = S.lib.find(x => x.id === b.dataset.open); if (!it || !it.out) return;
    S.takeaway = it.line; S.role = it.role || S.role; S.meta = { event: it.event || "", industries: [...(it.industries || [])], functions: [...(it.functions || [])], suggested: true };
    S.source = { kind: "text", name: it.sourceName || "Saved line", text: "", words: 0 };
    S.out = JSON.parse(JSON.stringify(it.out)); S.tab = "x"; mode = "result"; save(); render(); window.scrollTo(0, 0);
  }));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; return; }
    S.lib = S.lib.filter(x => x.id !== b.dataset.del); save(); render(); toast("Deleted");
  }));

  // result
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; save(); render(); }));
  const tl = $(".tabs");
  tl?.addEventListener("keydown", e => { if (e.key === "ArrowLeft" || e.key === "ArrowRight") { S.tab = S.tab === "x" ? "li" : "x"; save(); render(); $(S.tab === "x" ? "#tab-x" : "#tab-li").focus(); } });
  document.querySelectorAll("[data-x]").forEach(ta => ta.addEventListener("input", () => {
    const i = +ta.dataset.x; S.out.x[i] = ta.value; save();
    const c = document.querySelector(`[data-xc="${i}"]`); c.textContent = ta.value.length + "/280"; c.classList.toggle("over", ta.value.length > 280);
    if (i === 0) $("#open").href = "https://x.com/intent/post?text=" + encodeURIComponent(ta.value);
  }));
  $("#li")?.addEventListener("input", (e) => {
    S.out.linkedin = e.target.value; save();
    $("#lic").textContent = e.target.value.length + "/3000";
    const h = hook(e.target.value); $("#hk").textContent = h.slice(0, 210) + (h.length > 210 ? "…" : "");
  });
  const text = () => S.tab === "x" ? S.out.x.join("\n\n") : S.out.linkedin;
  $("#copy")?.addEventListener("click", async () => { try { await navigator.clipboard.writeText(text()); toast("Copied"); } catch { toast("Couldn't copy. Select the text and copy it yourself."); } });
  $("#open")?.addEventListener("click", async () => {
    let ok = false; try { await navigator.clipboard.writeText(text()); ok = true; } catch {}
    toast(S.tab === "x" ? (ok ? "Thread copied. Post 1 is filled in on X." : "Post 1 is filled in on X.") : (ok ? "Copied. Paste it into the LinkedIn post box." : "Copy the post, then paste it on LinkedIn."));
  });
  $("#again")?.addEventListener("click", write);
  $("#edit")?.addEventListener("click", () => { mode = "compose"; render(); $("#line")?.focus(); });
  document.querySelectorAll("[data-refine]").forEach(b => b.addEventListener("click", async () => {
    refining = true; const label = b.textContent; render();
    const btn = [...document.querySelectorAll("[data-refine]")].find(x => x.textContent === label); if (btn) btn.textContent = "Rewriting…";
    try {
      const r = await ask(refinePrompt(b.dataset.refine), { json: true });
      if (S.tab === "x" && Array.isArray(r && r.x) && r.x.length) S.out.x = r.x.map(String);
      else if (S.tab === "li" && r && r.linkedin) S.out.linkedin = String(r.linkedin).trim();
      else throw { code: "invalid_json" };
      save(); toast("Updated");
    } catch (e) { toast(errCopy(e)); }
    refining = false; render();
  }));
}

async function write() {
  if (!ready() || busy) return;
  busy = true; error = ""; mode = "result"; S.out = null; render();
  try {
    const r = await ask(mainPrompt(), { json: true });
    const x = (r && Array.isArray(r.x) ? r.x : []).map(String).map(s => s.trim()).filter(Boolean).slice(0, 6);
    const li = r && r.linkedin ? String(r.linkedin).trim() : "";
    if (!x.length || !li) throw { code: "invalid_json" };
    S.out = { x, linkedin: li };
    S.lib.unshift({ id: Math.random().toString(36).slice(2, 10), line: S.takeaway.trim(), event: S.meta.event.trim(), industries: [...S.meta.industries], functions: [...S.meta.functions], role: S.role, sourceName: S.source.name, at: Date.now(), out: JSON.parse(JSON.stringify(S.out)) });
    save();
  } catch (e) { error = errCopy(e); mode = "compose"; }
  busy = false; render();
}

/* ---------------- header ---------------- */
$("#file").addEventListener("change", e => { pasting = false; takeFile(e.target.files[0]); e.target.value = ""; });
$("#lib").addEventListener("click", () => { mode = mode === "library" ? (S.out ? "result" : "compose") : "library"; render(); window.scrollTo(0, 0); });
$("#how").addEventListener("click", () => { guideOpen = !guideOpen; $("#how").setAttribute("aria-expanded", String(guideOpen)); if (mode !== "compose") mode = "compose"; render(); });
$("#restart").addEventListener("click", () => { const role = S.role, lib = S.lib; S = blank(); S.role = role; S.lib = lib; mode = "compose"; error = ""; pasting = false; save(); render(); });
function tick() { const d = new Date(); let h = d.getHours(); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; $("#clock").innerHTML = `${String(h).padStart(2, "0")}.${String(d.getMinutes()).padStart(2, "0")}<small>${ap}</small>`; }
tick(); setInterval(tick, 15000);
window.addEventListener("resize", drawWave);
window.matchMedia && matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawWave);

// First visit: open the guide so the page explains itself
if (!S.source && !S.out) guideOpen = true;
$("#how").setAttribute("aria-expanded", String(guideOpen));
render();
getSample();
})();
</script>
